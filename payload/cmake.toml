# Reference: https://build-cpp.github.io/cmkr/cmake-toml
[cmake]
version = "3.19"
cmkr-include = "cmake/cmkr.cmake"

[project]
name = "payload"
cmake-before = "set(CMAKE_CONFIGURATION_TYPES Debug Release)"
include-after = ["cmake/riscvm.cmake"]
msvc-runtime = "static"

# Windows implementation of the riscvm syscalls (for debugging only)
[target.riscvm-crt0]
type = "shared"
sources = ["crt/riscvm-crt0.cpp"]

[template.riscvm]
type = "executable"
add-function = "add_riscvm_executable"
msvc.compile-options = ["/GR-", "/EHs-"]
clang.compile-options = ["-fno-exceptions", "-fno-rtti", "-Wno-inconsistent-dllimport"]
compile-definitions = ["_HAS_EXCEPTIONS=0", "__USE_MINGW_ANSI_STDIO=0"] # TODO: MSVC only?
msvc.link-options = ["/INCREMENTAL:NO", "/DEBUG"]
link-libraries = ["::riscvm-crt0", "ntdll.lib"]

[target.hello]
type = "riscvm"
sources = ["src/hello.c"]

[target.msgbox]
type = "riscvm"
sources = ["src/msgbox.c"]

[target.c2test]
type = "riscvm"
sources = ["src/c2test.c"]

[target.lsass]
type = "riscvm"
sources = ["src/lsass.cpp"]

[target.test_crt_stdio]
type = "riscvm"
sources = ["src/tests/test_crt_stdio.c"]

[target.test_crt_wide]
type = "riscvm"
sources = ["src/tests/test_crt_wide.c"]

[target.test_crt_mbwc]
type = "riscvm"
sources = ["src/tests/test_crt_mbwc.c"]

[target.test_crt_stat]
type = "riscvm"
sources = ["src/tests/test_crt_stat.c"]

[target.test_crt_time]
type = "riscvm"
sources = ["src/tests/test_crt_time.c"]

[target.test_crt_fini]
type = "riscvm"
sources = ["src/tests/test_crt_fini.cpp"]

[target.test_crt_scanf]
type = "riscvm"
sources = ["src/tests/test_crt_scanf.c"]

[target.test_crt_env]
type = "riscvm"
sources = ["src/tests/test_crt_env.c"]

[target.test_crt_alloc]
type = "riscvm"
